name: Build and archive checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: dotnet build R2Cmd.csproj -c Release -warnaserror
      - name: Check archive extraction
        run: dotnet run --project Tests/R2Cmd.ArchiveChecks.csproj -c Release -warnaserror
